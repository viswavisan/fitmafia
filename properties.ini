# Non-Sensitive Operational & Application Properties
# This file can be safely committed to version control.
[env]
env_path = /home/opc/secret/.env

[oci]
# OCI Storage & Config Paths
config = /home/opc/secret/config
namespace = axebie7reex5
bucket_name = Obucket
region=ap-hyderabad-1

[database]
# Oracle Wallet Directory Paths
oracle_wallet_path = /home/opc/secret/Wallet
database_url = /home/opc/fitmafia.db

[app]
# Application Server Properties
host = 127.0.0.1
port = 5000
permanent_session_lifetime_minutes = 30
