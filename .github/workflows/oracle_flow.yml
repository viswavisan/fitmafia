name: Oracle Flow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest --cov=fit_mafia --cov-report=xml:coverage.xml
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///test.db' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: scan   # ensures deploy runs only if tests + scan succeed
    steps:
      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@9b978f09f2587beff9c80449f57cb0f0612d3039
        with:
          host: 140.245.230.89
          username: opc
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            cd ~/fitmafia
            git pull origin main
            [ -d ".venv" ] || python3 -m venv .venv
            source .venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart dashboard.service || sudo systemctl restart flaskapp.service
